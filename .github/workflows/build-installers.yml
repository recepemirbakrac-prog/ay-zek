name: Build Ay Zek installers

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.ts"
      - "desktop/**"
      - "public/capacitor-shell/**"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli
      - name: Generate Android project
        run: npx cap add android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ay-zek-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron packager
        run: npm install --no-save electron electron-builder
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never --config.extraMetadata.main=desktop/main.cjs --config.productName="Ay Zek" --config.appId="com.ayzek.desktop" --config.directories.output=dist-installers --config.nsis.oneClick=false --config.nsis.allowToChangeInstallationDirectory=true
      - uses: actions/upload-artifact@v4
        with:
          name: ay-zek-windows-installer
          path: dist-installers/*.exe
          if-no-files-found: error
          retention-days: 14
